name: Source lateness check

# Hourly per-source "is it late?" check (JEG-1200, JEG-1201). Reads only what
# already exists: public.source_probe_state (written by every probe) and the
# week each source serves on the site (data/history/index.json, the chain
# status). Nothing here fetches a source. Late sources open one GitHub issue
# labelled `source-late`, which closes itself when every source is on time.
# What late means per source: docs/source-lateness.md, pipelines/source_lateness.py.
#
# Scheduler owner: this file's own `schedule:`, on purpose. Every other job is
# scheduled by Supabase pg_cron (AGENTS.md "Supabase first"), but this is the
# watchdog for those schedules: on Oct 20-21, 2026 the probes logged nothing
# for two days and nothing noticed. A check that shares the scheduler it
# watches goes quiet with it. Precedent: full-suite.yml.
#
# Never fails on a late source: the issue is the alert. It fails only if the
# check is incomplete or alert delivery fails (source_lateness.py returns 1),
# so an unreadable source state, unknown served week or GitHub API failure
# shows as a red run instead of going quiet.

on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:
    inputs:
      # JEG-1512: "true" runs only the week-held drill: opens a [drill] GitHub
      # issue (label week-held-drill) and a [drill] Linear sub-issue of
      # JEG-1512, then closes and archives both, proving the alert path end to end.
      week_held_drill:
        description: "Run only the week-held alert drill (JEG-1512)"
        required: false
        default: "false"

permissions:
  contents: read
  issues: write

concurrency:
  group: source-lateness
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install standalone Supabase client
        run: |
          mkdir -p /tmp/gh_shim
          cp pipelines/gh_sbclient.py /tmp/gh_shim/sbclient.py
          echo "PYTHONPATH=/tmp/gh_shim:$PYTHONPATH" >> $GITHUB_ENV

      - name: Check every source
        if: inputs.week_held_drill != 'true'
        env:
          SUPABASE_BYTES_CALLER: source-lateness:check-every-source
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          alert=""
          [ "${{ github.ref }}" = "refs/heads/main" ] && alert="--alert"
          python3 pipelines/source_lateness.py --supabase --out /tmp/source-lateness.json $alert

      # JEG-1512 staleness tripwire, on this workflow's own schedule (not the
      # pg_cron that dispatches the chain): if the committed chain status shows
      # a newer week than the committed history serves and that status is 2 h
      # old, the chain has not cleared it or its in-run alert did not fire, so
      # open the week-held alert. Branch runs only print.
      - name: Week-held tripwire (JEG-1512)
        if: always() && inputs.week_held_drill != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.GITHUB_TOKEN || '' }}
          LINEAR_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.LINEAR_API_KEY || '' }}
        run: python3 pipelines/week_held_alert.py --mode tripwire

      - name: Week-held alert drill (JEG-1512)
        if: inputs.week_held_drill == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: python3 pipelines/week_held_alert.py --mode drill

      # JEG-1586 heartbeat: this watchdog is scheduled by GitHub, not pg_cron, so nothing else notices if it stops, and
      # since PR #1381 it also runs the week-held tripwire. Record each scheduled or dispatched run on main, red or
      # green (the drill is not a heartbeat); the evaluator in health-artifacts.yml flags the check `missed` when an
      # hour passes with no run. Never fails the job. Declared in config/monitoring_coverage.json.
      - name: Record monitored check
        if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && inputs.week_held_drill != 'true'
        env:
          SUPABASE_BYTES_CALLER: source-lateness:record-monitored-check
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 pipelines/record_monitor_check.py --check-id source_lateness --owner source-lateness.yml --outcome "${{ job.status }}"

      - name: Retain Supabase byte counters (JEG-1458)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: supabase-bytes-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/supabase-bytes/*.md
          if-no-files-found: ignore
          retention-days: 14
