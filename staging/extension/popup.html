<h1>DDF: Connect ESPN</h1>
<p>Sign in at espn.com, then open <a href="https://datadrivenfootball.github.io/ddf-staging/" target="_blank">DDF</a> and press <strong>Connect ESPN</strong>.</p>
<p>DDF only reads your leagues and never sees your ESPN password.</p>
